admin_passwd = $pbkdf2-sha512$600000$nJOSUurdm3OuVap17n1vLQ$CnmpukRZ3p.cry.Ep29mDc4A9P6/NZ.H5KPB.k8NDSrTB/aL4Tu3v8xVC8oOYi1cGSqtxFIxZ0ViRk/DKHId3w
db_host = db
db_port = 5432
db_user = odoo
; Bind HTTP to exactly one database.
;
; Without this Odoo auto-selects only when there is EXACTLY ONE database. The
; moment a second one exists -- a `--test-enable` run leaves `lhc_mobtest_<epoch>`
; behind, or a fresh-install test DB is not dropped -- it can no longer choose,
; and every /api/mobile/* route answers 404 with the db logged as `?` while
; /web/login answers 303. Nothing in that says "ambiguous database", so it reads
; as a broken addon. `dev_mode = reload` re-reads the list on every .py edit, so
; the breakage can appear mid-session with no deploy.
;
; Comment this out if you ever need to reach another database from the browser.
dbfilter = ^lovely_homes_nest$
db_password = odoo
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
dev_mode = reload
log_level = info
logfile = /dev/stdout
workers = 0
max_cron_threads = 1
watchdog_enable = True
proxy_mode = True

