version: "3.9"

services:
  db:
    image: postgres:15
    container_name: lovelyhomenest_dev-db
    restart: always
    stop_grace_period: 180s
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s

  odoo:
    image: odoo:18
    container_name: lovelyhomenest_dev-web
    restart: always
    # Pin the SERVER to one database.
    #
    # Odoo auto-selects a database only when there is exactly one. The moment a
    # second exists -- a `--test-enable` run leaves `lhc_mobtest_<epoch>` or an
    # audit database behind -- it can no longer choose, and every
    # /api/mobile/* route answers 404 with the db logged as `?` while /web/login
    # answers 303. Nothing in that says "ambiguous database".
    #
    # This lives HERE and not in config/odoo.conf on purpose: odoo.conf is
    # shared with `docker compose run ... odoo -d <test_db> --test-enable`, and
    # a filter there routes the HttpCase requests to lovely_homes_nest instead
    # of the test database -- every mobile_rest_api HTTP test then fails 401.
    # A `run` command replaces this one, so test runs are unaffected.
    command: odoo --db-filter=^lovely_homes_nest$$
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8020:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./odoo18_hlc_nest:/mnt/extra-addons

volumes:
  db_data:
  odoo-web-data: