version: "3.9"

services:
  db:
    image: postgres:15
    container_name: lovelyhomenest_dev-db
    restart: always
    stop_grace_period: 180s
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 600s

  odoo:
    image: odoo:18
    container_name: lovelyhomenest_dev-web
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8020:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./custom_addons:/mnt/extra-addons

volumes:
  db_data:
  odoo-web-data: