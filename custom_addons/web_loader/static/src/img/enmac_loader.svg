<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 96" width="130" height="96" shape-rendering="geometricPrecision">
    <!--
        SVG/CSS port of the dotLottie animation
        lottie.host/cbf6d004-2fb7-4db8-8343-b3c65308867f/HHU9y5jsdC.lottie

        Values read straight out of the .lottie (a ZIP holding manifest.json
        plus the animation JSON), so this is a port rather than an impression:

          * 4 ellipses, diameter 20.969   -> r = 10.4845
          * x spacing 30 units            -> centres at 20 / 50 / 80 / 110
          * scale 75% -> 150% -> 75%
          * travel 30 units, ALTERNATING: dots 1 and 3 go up, 2 and 4 go down
            (a zig-zag, not a uniform wave)
          * 25 fps, 26-frame motion cycle -> 1.04s
          * per-dot stagger of 2 frames   -> 0.08s
          * base fill #2A88D5; dots 2/3/4 cross-fade to #80C6FF / #D9E0E6 /
            #A1ADB7 on their own 33-frame cycle -> 1.32s

        The two periods (1.04s motion, 1.32s tint) differ on purpose; that
        polyrhythm is in the source file and is what keeps the loop from
        reading as mechanical.

        Animated with CSS *inside* the SVG so it keeps running when the file is
        used as a CSS background-image (scripts would not run there, but CSS
        animations do). transform-box:fill-box makes transform-origin:center
        resolve against each circle's own box rather than the whole canvas.

        Deliberately dropped from the original: a null-parent layer drifting the
        whole group 122px left over 33 frames. That exists only to cross-fade
        the source's two stacked comp instances into a seamless loop; a CSS
        infinite animation loops natively, so porting the drift would just make
        the dots wander off-centre.

        viewBox height 96 accommodates the worst case, where peak travel and
        peak scale coincide: 48 +/- 30 +/- 15.73.
    -->
    <style>
        circle {
            transform-box: fill-box;
            transform-origin: center;
        }
        #dot1 { animation: enmac-bounce-up   1.04s ease-in-out 0s    infinite; }
        #dot2 {
            animation: enmac-bounce-down 1.04s ease-in-out 0.08s infinite,
                       enmac-tint-2      1.32s ease-in-out 0s    infinite;
        }
        #dot3 {
            animation: enmac-bounce-up   1.04s ease-in-out 0.16s infinite,
                       enmac-tint-3      1.32s ease-in-out 0s    infinite;
        }
        #dot4 {
            animation: enmac-bounce-down 1.04s ease-in-out 0.24s infinite,
                       enmac-tint-4      1.32s ease-in-out 0s    infinite;
        }

        @keyframes enmac-bounce-up {
            0%, 100% { transform: translateY(0)     scale(0.75); }
            50%      { transform: translateY(-30px) scale(1.5); }
        }
        @keyframes enmac-bounce-down {
            0%, 100% { transform: translateY(0)     scale(0.75); }
            50%      { transform: translateY(30px)  scale(1.5); }
        }

        @keyframes enmac-tint-2 {
            0%, 100% { fill: #2A88D5; }
            51.5%    { fill: #80C6FF; }
        }
        @keyframes enmac-tint-3 {
            0%, 100% { fill: #2A88D5; }
            51.5%    { fill: #D9E0E6; }
        }
        @keyframes enmac-tint-4 {
            0%, 100% { fill: #2A88D5; }
            51.5%    { fill: #A1ADB7; }
        }

        /* Respect the OS "reduce motion" setting: hold a static row of dots. */
        @media (prefers-reduced-motion: reduce) {
            circle { animation: none; }
        }
    </style>
    <circle id="dot1" cx="20"  cy="48" r="10.4845" fill="#2A88D5"/>
    <circle id="dot2" cx="50"  cy="48" r="10.4845" fill="#2A88D5"/>
    <circle id="dot3" cx="80"  cy="48" r="10.4845" fill="#2A88D5"/>
    <circle id="dot4" cx="110" cy="48" r="10.4845" fill="#2A88D5"/>
</svg>
